# MitoM (github.com/deyuanyang92-dev/Mitom) native core: versions = its env/mitotools.yml as validated 2026-10;
# the MitoM code and MITOS2 reference data are fetched by rule mitom_db
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python =3.11
  - biopython =1.88
  - exonerate =2.4.0
  - blast =2.17.0
  - infernal =1.1.5
  - table2asn =1.28.1179
  - aragorn =1.2.41
  - trnascan-se =2.0.13
  - hmmer =3.4
  - mafft =7.526
  - openjdk =25
  - git
  - wget
