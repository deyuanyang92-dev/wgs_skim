# Trinity de novo transcriptome assembly; 2.15.2 = the version of the user's trinity_batch3.1.py image
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - trinity =2.15.2=pl5321h077b44d_3   # builds _4.._6 ship a ParaFly that ignores -CPU: phase 2 runs serially
                                       #   (trinityrnaseq#1473; 8 test jobs: 16 s vs 2 s) - docs/tools/Trinity.md
  - salmon =1.10.3                     # Trinity 2.15.2 calls `salmon quant --minAssignedFrags`; salmon >= 2 (Rust
                                       #   rewrite) removed it: "unexpected argument" (tools2, 2026-10-30)
