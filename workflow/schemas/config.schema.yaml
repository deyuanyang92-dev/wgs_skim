$schema: "http://json-schema.org/draft-07/schema#"
description: wgs_skim configuration (config/config.yaml)
type: object
properties:
  reads_dir: {type: string, description: "directory of paired FASTQ files; sample names are detected automatically"}
  samples: {type: string, description: "optional sample sheet (TSV/CSV: sample, fastq_1, fastq_2) instead of reads_dir"}
  outdir: {type: string, default: results}
  db_dir: {type: string, default: ""}
  taxon: {type: string, enum: [annelid, mollusc, fish, crustacean], default: annelid}
  genetic_code: {type: [integer, string], default: ""}
  meangs_class:
    type: string
    enum: ["", A-worms, Arthropoda, Bryozoa, Chordata, Echinodermata, Mollusca, Nematoda, N-worms, Porifera-sponges]
    default: ""
  clade:
    type: string
    enum: ["", Chordata, Arthropoda, Echinodermata, Annelida-segmented-worms, Bryozoa, Mollusca, Nematoda,
           Nemertea-ribbon-worms, Porifera-sponges, Animal]
    default: ""
  mitos_refdir: {type: string, default: "", description: "existing MITOS2 reference directory containing refseq89m"}
  busco_lineage: {type: string, default: ""}
  steps: {type: string, default: "", description: "run only these steps (comma separated); empty = all switched on"}
  qc: {type: boolean, default: true, description: "false: the reads are used as they are (fastp only counts them)"}
  busco_mode: {type: string, enum: [genome, transcriptome, proteins], default: genome}
  mitofinder_ref: {type: string, default: ""}
  mitofinder_sif: {type: string, default: ""}
  mitofinder_assembly: {type: string, default: ""}
  mitofinder_min_contig: {type: integer, default: 1000}
  mitofinder_min_contig_rna: {type: integer, default: 300}
  mitofinder_cov_factor: {type: [integer, number], default: 5}
  mitofinder_max_pairs: {type: integer, default: 10000000}
  mitofinder_blast: {type: boolean, default: true}
  mitofinder_blast_genes: {type: string, default: all}
  mitofinder_min_pident: {type: [integer, number], default: 85}
  mitofinder_trna: {type: string, enum: [mitfi, trnascan, arwen], default: mitfi}
  mitofinder_mem_gb: {type: [integer, number], default: 32}
  meangs: {type: boolean, default: true}
  mito: {type: boolean, default: true}
  nr: {type: boolean, default: true}
  assembly: {type: boolean, default: true}
  nuc_markers: {type: boolean, default: true}
  genome_size: {type: boolean, default: true}
  annotate: {type: boolean, default: true}
  topology: {enum: [auto, "yes", "no", true, false], default: auto}
  mitofinder: {type: boolean, default: false}
  blast: {type: boolean, default: true}
  getorganelle_kmers: {type: string, default: "21,45,65,85,105"}
  getorganelle_rounds: {type: integer, minimum: 1, default: 10}
  meangs_reads: {type: integer, minimum: 1, default: 2000000}
  insert_size: {type: integer, minimum: 1, default: 350}
  mt_iter_rounds: {type: integer, minimum: 0, default: 3}
  mt_iter_R: {type: integer, minimum: 1, default: 20}
  mt_from_spades: {type: boolean, default: true}
  mt_iter_max_data_gb: {type: number, minimum: 0, default: 20}
  nr_seed: {type: string, default: ""}
  spades_modes: {type: string, default: "genome"}
  spades_kmers: {type: [string, integer], default: ""}
  rnaspades_kmers: {type: [string, integer], default: "auto"}
  spades_careful: {type: boolean, default: false}
  spades_only_assembler: {type: boolean, default: false}
  spades_mode_gib_per_gb: {type: number, minimum: 0, default: 5}
  trinity_gib_per_gb: {type: number, minimum: 0, default: 6}
  trinity_extra: {type: string, default: ""}
  nr_label: {type: string, default: ""}
  histone_seed: {type: string, default: ""}
  histone_label: {type: string, default: ""}
  nuclear_max_gb: {type: [string, number], default: "5,10", description: "Gb of reads per GetOrganelle round (rDNA, histones)"}
  spades_min_clean_gb: {type: number, minimum: 0, default: 0}
  spades_gib_per_gb: {type: number, minimum: 0, default: 6.5}
  spades_min_mem_gb: {type: number, minimum: 1, default: 32}
  topology_pairs: {type: integer, minimum: 0, default: 10000000}
  kmer_size: {type: integer, minimum: 11, default: 21}
  ploidy: {type: integer, minimum: 1, default: 2}
  blast_db: {type: string, default: ""}
  blast_mt: {type: string, default: "cox1", description: "full and/or mitochondrial genes, comma separated"}
  blast_nr: {type: string, default: "18S,ITS,28S", description: "full and/or 18S ITS ITS1 5.8S ITS2 28S"}
  mitom_commit: {type: string, default: "27264d2cf672c718deff6915317a7ee01852830b"}
  mitom_nuc_commit: {type: string, default: "6f75f73373ad5198c200b6da222a5975d7ee73ea"}
  mitom_dir: {type: string, default: "", description: "use this MitoM checkout instead of the pinned commits"}
  blast_topn: {type: integer, minimum: 1, default: 5}
  email: {type: string, default: ""}
anyOf:
  - required: [reads_dir]
  - required: [samples]
